# Phase 0 infrastructure. Two services only.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (DESTROYS data, re-runs init.sql)

services:
  postgres:
    # pgvector's official image = postgres 17 with the vector extension preinstalled.
    image: pgvector/pgvector:pg17
    container_name: eaip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by init.sql via psql variable substitution.
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is empty.
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./infra/postgres/init-analytics.sh:/docker-entrypoint-initdb.d/20-analytics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eaip-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A MySQL stand-in for the systems this platform actually serves — the ERP,
  # WMS, MES, and IoT databases all run MySQL. Every SQL safety layer was built
  # and tested against Postgres, so "the database refuses writes" was a claim
  # about an engine nobody uses. This is what makes it a tested one (ADR 0008).
  #
  # Port 3307 on the host: 3306 is commonly taken by a local MySQL, and on the
  # deployment machine it is taken by an existing container. Same reasoning as
  # Postgres on 5433.
  mysql:
    image: mysql:8.4
    container_name: eaip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-owner-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      # Runs ONCE, only when the data volume is empty.
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-ci-owner-password}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  mysqldata:
