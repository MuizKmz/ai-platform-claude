# Phase 0 infrastructure. Two services only.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (DESTROYS data, re-runs init.sql)

services:
  postgres:
    # pgvector's official image = postgres 17 with the vector extension preinstalled.
    image: pgvector/pgvector:pg17
    container_name: eaip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by init.sql via psql variable substitution.
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, only when the data volume is empty.
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./infra/postgres/init-analytics.sh:/docker-entrypoint-initdb.d/20-analytics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eaip-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A MySQL stand-in for the systems this platform actually serves — the ERP,
  # WMS, MES, and IoT databases all run MySQL. Every SQL safety layer was built
  # and tested against Postgres, so "the database refuses writes" was a claim
  # about an engine nobody uses. This is what makes it a tested one (ADR 0008).
  #
  # Port 3307 on the host: 3306 is commonly taken by a local MySQL, and on the
  # deployment machine it is taken by an existing container. Same reasoning as
  # Postgres on 5433.
  mysql:
    image: mysql:8.4
    container_name: eaip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci-owner-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      # Runs ONCE, only when the data volume is empty.
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-ci-owner-password}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # The identity provider (ADR 0009). Everything above this line existed before
  # anyone could log in properly; this is what makes a second user possible.
  #
  # Port 8081 on the host: 8080 is Keycloak's own default and is the single most
  # contested port on a development machine. Same reasoning as Postgres on 5433.
  #
  # `start-dev` is deliberate and is NOT a production command. It serves plain
  # HTTP, disables the hostname strictness that a real deployment needs, and
  # keeps an in-memory cache. Production uses `start` behind TLS — see
  # docker-compose.prod.yml, which overrides this.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eaip-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # The bootstrap admin. Development only: production creates an admin
      # interactively and this pair is never set, so there is no default
      # credential to forget about.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Its own database, in its own container. Sharing EAIP's Postgres would
      # put a third-party product's schema and migrations inside the database
      # whose RLS policies are the platform's tenant boundary.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # Imported ONCE, when the realm does not already exist. Editing the file
      # afterwards changes nothing until the volume is reset — realm changes
      # made in the console are the source of truth from then on.
      - ./infra/keycloak/realm-eaip.json:/opt/keycloak/data/import/realm-eaip.json:ro
      # The custom login theme (infra/keycloak/themes/eaip/) — CSS only,
      # extends the built-in keycloak.v2 theme rather than replacing its
      # templates. Unlike the realm import, mounted files here are read on
      # every request, not imported once — editing the CSS and restarting
      # the container (or, once set, a Keycloak cache-clear) is enough.
      - ./infra/keycloak/themes/eaip:/opt/keycloak/themes/eaip:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The management port (9000) serves health; the distroless image has no
      # shell and no curl, so this uses the JVM's own client.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Keycloak's own storage. Separate from EAIP's Postgres on purpose — see the
  # KC_DB comment above. It is also a separate backup obligation: a restore that
  # recovers EAIP but not this one recovers a platform nobody can log into.
  keycloak-db:
    image: postgres:17-alpine
    container_name: eaip-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev-password}
      POSTGRES_DB: keycloak
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mysqldata:
  keycloakdata:
