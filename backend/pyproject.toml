[project]
name = "eaip-backend"
version = "0.1.0"
description = "Enterprise AI Integration Platform — backend"
requires-python = ">=3.12,<3.13"

# Phase 0 dependencies ONLY. No LLM SDK, no vector library, no agent framework.
# Each arrives in the phase that needs it, with an ADR in docs/adr/.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.2,<6.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "openai>=1.60,<3.0",
    "pypdf>=5.1,<7.0",
    "python-docx>=1.1,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<7.0",
    "arq>=0.26,<1.0",
    # MySQL driver. Pure Python on purpose — see ADR 0008. The C drivers are
    # faster and need a build toolchain, and we are bound by a model call that
    # takes a second, not by 3ms of driver overhead.
    "pymysql>=1.1,<2.0",
    "sqlglot>=25.0,<28.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1.1,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # Kills a hanging test and NAMES it. Without this a stall is a silent
    # twelve-minute CI step with no output at all, which is what one was.
    "pytest-timeout>=2.3,<3.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "reportlab>=4.2,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The security suite is named so CI can report on it separately and so it can
# never be quietly skipped: `pytest -m security` must stay green forever.
# A test that hangs is worse than one that fails: it produces no output at all.
# One CI run sat on `pytest -q` for twelve minutes without printing a single
# dot, and the log said nothing about which test was responsible.
#
# 120s is roughly 25x the slowest real test (5.1s), so it cannot fire on a
# machine that is merely slow. `thread` method rather than `signal` because
# signal-based timeouts do not work on Windows.
timeout = 120
timeout_method = "thread"

markers = [
    "security: tenant isolation and authorization guarantees",
    # Shells out to docker and creates databases. Deselect with -m 'not slow'.
    "slow: seconds rather than milliseconds; needs a running container",
]
# Fail loudly on an unraisable warning rather than letting it scroll past.
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic generates these; they are not hand-maintained code.
extend-exclude = ["alembic/versions", "alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N", "SIM"]
# S101 = assert. Fine in tests, not in app code.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
# SQLAlchemy and redis stubs are imperfect; do not let third-party gaps block us.
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
