name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres, so the Row-Level Security tests actually run. Without this
    # they would skip, and a skipped security test reports green while proving
    # nothing — the exact failure mode roadmap rule #3 exists to prevent.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eaip
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: eaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      POSTGRES_USER: eaip
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_DB: eaip
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_APP_PASSWORD: ci-app-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml,
        # so a forgotten `uv lock` cannot pass CI.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Create the read-only role
        # Phase 0 creates this in infra/postgres/init.sh, which a CI service
        # container never runs. The migration grants to it, so it must exist first.
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5432 -U eaip -d eaip             -c "CREATE ROLE app_readonly LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-readonly-password'"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -q

      - name: Security suite must actually run
        # A skipped security test is worse than a failing one: it reports green
        # while proving nothing. -p no:randomly keeps output stable; the explicit
        # "0 skipped" assertion is what catches a database that never connected.
        run: |
          uv run pytest -m security -q --no-header > result.txt 2>&1 || {
            cat result.txt; exit 1;
          }
          cat result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::Security tests were SKIPPED. They must run in CI."
            exit 1
          fi
          grep -qE "[0-9]+ passed" result.txt || {
            echo "::error::Security suite reported no passing tests."; exit 1;
          }
