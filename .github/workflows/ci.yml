name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres, so the Row-Level Security tests actually run. Without this
    # they would skip, and a skipped security test reports green while proving
    # nothing — the exact failure mode roadmap rule #3 exists to prevent.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eaip
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: eaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      POSTGRES_USER: eaip
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_DB: eaip
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_APP_PASSWORD: ci-app-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Not a real secret: CI mints and verifies its own tokens within the job.
      # A production key comes from a secret manager and never from a workflow file.
      JWT_SECRET: ci-only-signing-key-not-used-anywhere-else
      JWT_ISSUER: https://eaip.local
      JWT_AUDIENCE: eaip-api
      JWT_TTL_MINUTES: 60
      # Not a real secret: CI encrypts and decrypts within the job and stores
      # nothing. A production key comes from a secret manager.
      CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # CI's analytics database is a service container on localhost.
      ALLOW_LOOPBACK_CONNECTORS: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # v7 is the newest floating major tag and runs on Node 24. v6 targeted Node 20, which GitHub deprecated
        # and now force-runs on 24 with a warning on every build.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml,
        # so a forgotten `uv lock` cannot pass CI.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Create the read-only role
        # Phase 0 creates this in infra/postgres/init.sh, which a CI service
        # container never runs. The migration grants to it, so it must exist first.
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5432 -U eaip -d eaip             -c "CREATE ROLE app_readonly LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-readonly-password'"

      - name: Provision the analytics database
        # infra/postgres/init-analytics.sh runs only on a fresh Docker volume,
        # and a CI service container never runs init scripts at all. Without
        # this, 47 connector security tests skip — and a skipped security test
        # reports green while proving nothing.
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_READONLY_PASSWORD: ${{ env.POSTGRES_READONLY_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          PGHOST: localhost
          PGPORT: "5432"
        run: bash ../infra/postgres/init-analytics.sh

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -q

      - name: Security suite must actually run
        # A skipped security test is worse than a failing one: it reports green
        # while proving nothing. -p no:randomly keeps output stable; the explicit
        # "0 skipped" assertion is what catches a database that never connected.
        run: |
          uv run pytest -m security -q --no-header > result.txt 2>&1 || {
            cat result.txt; exit 1;
          }
          cat result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::Security tests were SKIPPED. They must run in CI."
            exit 1
          fi
          grep -qE "[0-9]+ passed" result.txt || {
            echo "::error::Security suite reported no passing tests."; exit 1;
          }
