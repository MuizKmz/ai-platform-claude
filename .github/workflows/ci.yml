name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. Six pushes queued behind one stuck job meant nothing
# reported at all — with this, a new push cancels the previous run rather than
# waiting for it, so the newest commit is the one that gets an answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Without this a stuck job runs until GitHub's 6-hour cap. One did: it sat
    # on the Test step for 85 minutes with `updated_at` frozen five seconds
    # after it started, which is a silent runner rather than a slow test — and
    # five later pushes queued behind it, so nothing reported at all.
    #
    # The suite takes ~2 minutes. Fifteen is generous and still fails fast
    # enough that a hang is visible within a coffee break.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A real Postgres, so the Row-Level Security tests actually run. Without this
    # they would skip, and a skipped security test reports green while proving
    # nothing — the exact failure mode roadmap rule #3 exists to prevent.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eaip
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: eaip
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      POSTGRES_USER: eaip
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_DB: eaip
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_APP_PASSWORD: ci-app-password
      POSTGRES_READONLY_PASSWORD: ci-readonly-password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Not a real secret: CI mints and verifies its own tokens within the job.
      # A production key comes from a secret manager and never from a workflow file.
      JWT_SECRET: ci-only-signing-key-not-used-anywhere-else
      JWT_ISSUER: https://eaip.local
      JWT_AUDIENCE: eaip-api
      JWT_TTL_MINUTES: 60
      # Not a real secret: CI encrypts and decrypts within the job and stores
      # nothing. A production key comes from a secret manager.
      CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # CI's analytics database is a service container on localhost.
      ALLOW_LOOPBACK_CONNECTORS: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # v7 is the newest floating major tag and runs on Node 24. v6 targeted Node 20, which GitHub deprecated
        # and now force-runs on 24 with a warning on every build.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with pyproject.toml,
        # so a forgotten `uv lock` cannot pass CI.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Create the read-only role
        # Phase 0 creates this in infra/postgres/init.sh, which a CI service
        # container never runs. The migration grants to it, so it must exist first.
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -p 5432 -U eaip -d eaip             -c "CREATE ROLE app_readonly LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-readonly-password'"

      - name: Provision the analytics database
        # infra/postgres/init-analytics.sh runs only on a fresh Docker volume,
        # and a CI service container never runs init scripts at all. Without
        # this, 47 connector security tests skip — and a skipped security test
        # reports green while proving nothing.
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_READONLY_PASSWORD: ${{ env.POSTGRES_READONLY_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          PGHOST: localhost
          PGPORT: "5432"
        run: bash ../infra/postgres/init-analytics.sh

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Start the demo write target
        # Phase 9's approval tests write to a real HTTP service, because
        # idempotency and compensating actions are properties of an HTTP
        # conversation — a mock returning whatever the test wants proves the
        # platform CALLS something without proving that calling twice creates
        # one ticket.
        #
        # Without this, 17 security tests skip. The "Security suite must
        # actually run" step below then fails the build, which is correct: a
        # skipped security test reports green while proving nothing.
        run: |
          set -euo pipefail
          nohup uv run --with fastapi --with uvicorn python -m uvicorn main:app --port 9100 --app-dir ../infra/demo-api > /tmp/demo-api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9100/health > /dev/null; then
              echo "demo API is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::demo API failed to start within 30s"
          cat /tmp/demo-api.log
          exit 1

      - name: Test
        # -v and --timeout so a stall is diagnosable rather than silent. One run
        # sat here for twelve minutes and printed nothing at all — not a dot —
        # so the log could not say which test was responsible. Verbose output
        # names each test as it starts; pytest-timeout kills one that hangs and
        # prints its file, line, and stack.
        run: |
          set -o pipefail
          uv run pytest -v --timeout=120 --durations=10 -rA 2>&1 | tee /tmp/pytest.log

      - name: Upload the test log
        # Always, not just on failure. A green run's log is what you compare a
        # red one against, and the logs API needs credentials this workflow
        # does not have — an artifact is readable by anyone who can see the run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: /tmp/pytest.log
          retention-days: 7

      - name: Red-team corpus
        # Already covered by the run above; repeated as its own step because the
        # Phase 8 DoD requires the corpus to run in CI and this makes it a named
        # gate rather than a line in a summary. A green build should be
        # readable as "zero successful escalations" without opening the log.
        run: uv run pytest tests/security/test_redteam_corpus.py -q

      - name: Dependency scan
        # pip-audit against the resolved lockfile. Advisory data changes daily,
        # so this can fail on a commit that changed nothing — which is the
        # point: a vulnerability disclosed today is one we want to hear about
        # today, not at the next dependency bump.
        run: |
          uv export --frozen --no-dev --no-emit-project > /tmp/requirements.txt
          uv run --with pip-audit pip-audit --disable-pip --requirement /tmp/requirements.txt

      - name: Security suite must actually run
        # A skipped security test is worse than a failing one: it reports green
        # while proving nothing. -p no:randomly keeps output stable; the explicit
        # "0 skipped" assertion is what catches a database that never connected.
        run: |
          # Deselect `slow`: the restore test needs the eaip-postgres CONTAINER,
          # which a service container is not — it is a bare Postgres with no
          # docker exec to run pg_dump inside. Deselecting is honest; the two
          # tests in that file which need no container still run, because their
          # docker requirement is applied per test rather than per module.
          uv run pytest -m "security and not slow" -q --no-header > result.txt 2>&1 || {
            cat result.txt; exit 1;
          }
          cat result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::Security tests were SKIPPED. They must run in CI."
            cat result.txt
            exit 1
          fi
          grep -qE "[0-9]+ passed" result.txt || {
            echo "::error::Security suite reported no passing tests."; exit 1;
          }
