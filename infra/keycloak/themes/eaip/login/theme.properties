# EAIP's own login theme.
#
# Extends Keycloak's built-in "keycloak.v2" theme (Keycloak 26 / PatternFly
# v5) rather than replacing its templates. This keeps Keycloak's supported
# password, recovery and MFA flows intact while the CSS makes them feel like
# EAIP.
#
# The password field must render on Keycloak's own origin. EAIP's /login
# screen handles the welcome/departure transition; this theme makes the short
# credential step feel like the same product without recreating app-side JS.
parent=keycloak.v2
import=common/keycloak
styles=css/eaip-login.css
