# EAIP's own login theme.
#
# Extends Keycloak's built-in "keycloak.v2" theme (verified live against
# aiplatform.clbgroups.com on 2026-08-28 -- this realm runs Keycloak 26's
# PatternFly v5 theme, not an older Bootstrap-based one; every selector in
# eaip-login.css was checked against the real rendered HTML, not guessed
# from an older Keycloak version's class names) rather than replacing its
# templates.
#
# The password field must render on Keycloak's own origin -- that boundary
# is the entire point of using an identity provider, and EAIP's own /login
# page (frontend/src/app/login/page.tsx) already does the styled approach
# and departure screens around this one. This theme's only job is making
# the ~10 seconds someone spends on THIS screen not read as a different,
# uglier product: same background, same accent, same font, same mark.
#
# Deliberately not attempting the glass-surface / gradient-mesh treatment
# from globals.css here -- that is real interactive CSS (backdrop-filter,
# pointer-tracked bloom) built for a page under our own control. Recreating
# it in a FreeMarker template for a page whose entire job is a password
# field is effort spent on a screen nobody lingers on.
parent=keycloak.v2
import=common/keycloak
styles=css/eaip-login.css
