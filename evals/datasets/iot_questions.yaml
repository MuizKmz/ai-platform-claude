# NL->SQL accuracy against the real IoT curated views.
#
# Unlike sql_questions.yaml, these run against a LIVE production database
# reached over an SSH tunnel — the same one the pilot uses. That has one
# consequence worth stating loudly:
#
#   THE DATA MOVES. Temperature readings arrive every minute. An expectation
#   written as an exact average is wrong by tomorrow.
#
# So expectations here come in two kinds:
#
#   `expected`  — an exact result, for facts that do not drift (how many
#                 devices exist, how many are online, what the schedule says).
#
#   `between`   — [min, max] for a single numeric answer that moves but stays
#                 in a known band. A server room holding 26-28°C is a fact
#                 about the room; the third decimal place is not.
#
# Questions are phrased the way an operator would actually ask them, not the
# way a schema would suggest. "Which machines are down?" rather than "SELECT
# devices WHERE status = 'offline'". If the platform only answers the second
# phrasing it is a SQL console with extra steps.
#
# Ground truth captured 2026-08-25 against 6 devices and 345,551 metric rows.

# --- devices: the simplest thing anyone asks ---------------------------------

- question: How many devices do we have?
  expected: [[6]]
  kind: answerable

- question: Which devices are offline?
  expected_row_count: 5
  kind: answerable

- question: How many devices are online right now?
  expected: [[1]]
  kind: answerable

- question: Is the server room unit online?
  contains: "online"
  kind: answerable

- question: What devices are down?
  expected_row_count: 5
  kind: answerable
  note: >-
    Deliberately says "down" rather than "offline". An operator does not read
    the schema before speaking.

    Was "what MACHINES are down", expecting 5. The model answered 2 — the two
    devices actually named Machine-001-001 and Machine-002-002 — which is a
    better reading of the word than the one the test assumed. The question was
    changed rather than the answer marked wrong.

    This phrasing is why routing stopped guessing vocabulary: "machines" and
    "down" matched no keyword, so the question reached no tool at all and
    answered "I don't have enough information" about five offline devices.

- question: When was the smart pole last seen?
  contains: "2026-08-21"
  kind: answerable

# --- the metric people actually watch ----------------------------------------

- question: What is the average temperature in the server room over the last 24 hours?
  between: [24.0, 31.0]
  kind: answerable
  note: >-
    The reviewed training profile maps "server room condition" to the
    temperature metric on SERVER ROOM UNIT. Measured 27.11 on 2026-08-25 with
    1440 readings; the band allows for seasonal drift without allowing a wrong
    device or a wrong metric.

- question: What was the server room condition in the last 24 hours?
  between: [24.0, 31.0]
  kind: answerable
  note: >-
    Same question in the customer's own vocabulary. This is what Training
    exists for — if this fails while the one above passes, the reviewed
    profile is not reaching the model.

- question: What is the highest temperature recorded in the server room in the last 24 hours?
  between: [24.0, 32.0]
  kind: answerable

- question: What is the lowest temperature in the server room in the last 24 hours?
  between: [23.0, 30.0]
  kind: answerable

- question: How hot is the office right now?
  between: [15.0, 35.0]
  kind: answerable
  note: OFFICE MONITORING UNIT averages 26.85 across its history.

- question: What metrics do we collect?
  expected_row_count_at_least: 8
  kind: answerable
  note: Twelve metric types exist. Any sensible answer lists most of them.

# --- alerts -------------------------------------------------------------------

- question: Are there any active alerts?
  expected_row_count_at_least: 1
  kind: answerable

- question: How many critical alerts are there?
  expected: [[5]]
  kind: answerable

- question: Which devices have alerts against them?
  expected_row_count: 5
  kind: answerable

# --- production ---------------------------------------------------------------

- question: How many rows are in the production schedule?
  expected: [[7]]
  kind: answerable
  note: >-
    Was "how many production shifts are scheduled", and the model was arguably
    right to answer 5: shown that shift_name holds 'Morning', 'Morning Shift'
    and 'Night Shift', it counted the two that look like shift names. That is
    defensible reading of an ambiguous question, so the question was made
    unambiguous rather than the answer marked wrong.

    Worth keeping as a note: value hints made the model reason ABOUT the values
    rather than only match them, which is a better failure than the silent zero
    rows it produced before.

- question: What is the target output for the assembly process?
  expected_row_count_at_least: 1
  kind: answerable

- question: What processes do we run?
  expected_row_count_at_least: 2
  kind: answerable
  note: Assembly Process and Cold Process.

# --- reasoning that needs more than a filter ------------------------------------

- question: Which device has the most readings?
  expected_row_count: 1
  kind: answerable
  note: Device-002 with 185,024 of 345,551 rows.

- question: How many different metrics do we collect?
  expected: [[14]]
  kind: answerable

- question: Show me the production schedule for August
  expected_row_count: 2
  kind: answerable
  note: >-
    Both rows are 2026-08-18. This failed with "matched no data" because the
    model wrote BETWEEN '2023-08-01' AND '2023-08-31' — it cannot know the
    current year and supplied one from training. Relative windows
    (NOW() - INTERVAL) had always worked, which is why it stayed hidden: the
    failure needs a question that names a month or year without one.

- question: Which device has been offline the longest?
  expected_row_count: 1
  kind: answerable
  note: >-
    Machine-001-001, last seen 2026-05-20. Answered with all five offline
    devices, because the no-LLM status template matched "which" + "offline"
    and ignored "the longest" — an easier question answered as though it were
    the one asked. The SQL model gets this right, so the template was losing
    an answer rather than saving a call.

# --- the honest failures ------------------------------------------------------
#
# A system that answers everything is not being honest. These must produce a
# refusal, not a plausible number. A confident wrong answer is the worst
# output this platform can produce, because nobody checks a number that looks
# fine.

- question: What is our OEE for last week?
  kind: unanswerable
  note: >-
    THE MOST IMPORTANT QUESTION IN THIS FILE. oee_device_config is populated
    for 97 devices, so the platform looks like it should answer — but
    total_count and reject_count have 92 rows between them and stopped on
    2026-06-19. There is no recent data to compute OEE from. Answering with a
    number derived from June data, presented as "last week", would be a
    confident lie about a headline manufacturing metric.

- question: Which operator was on shift when Machine-001 went down?
  kind: unanswerable
  note: No operator or personnel data exists in the curated views.

- question: How much did we spend on electricity last month?
  kind: unanswerable
  note: >-
    An energy METRIC exists, which makes this feel answerable. There is no
    tariff, no cost, and no billing data anywhere in these views.

- question: What is the maintenance schedule for the smart pole?
  kind: unanswerable
  note: Production schedule exists; maintenance schedule does not.

- question: Who acknowledged the critical alert on Machine-002?
  kind: unanswerable
  note: >-
    v_active_alerts carries no acknowledgement, owner, or audit column. The
    alert is visible; who touched it is not.

- question: What will the server room temperature be tomorrow?
  kind: unanswerable
  note: >-
    Prediction, not retrieval. The platform reports what was measured; a
    forecast would be invention presented in the same voice as a fact.

# --- KNOWN BUG, found in manual testing 2026-08-25 ----------------------------
#
# Not a question: a note where the next person will trip over it.
#
# When the SSH tunnel is down, `_register_stored_sql_tools` catches the
# ConnectorError from describe_schema, logs a warning, and skips the connector.
# The agent then answers from documents alone and reports the absence as fact:
#
#   "The information about the total number of devices is not available in
#    the accessible documents."
#
# That sentence is true and useless. The real answer is "your IoT integration
# is unreachable", and the user cannot tell the difference between a dropped
# tunnel and a platform that does not know anything.
#
# Worse, the trace shows a DENIAL for `query_database` — the analytics tool the
# caller has no label for — which points at the wrong problem entirely.
#
# Phase 7's own rule: "a dead connector produces an explicit 'I could not reach
# X', not a hallucinated substitute." The failure is logged server-side and
# never reaches the answer.
