# Production overlay. Applied ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base file stays a development file. Nothing here changes local work,
# which is what keeps `docker compose up -d` on a laptop from acquiring
# production semantics nobody wanted.
#
# Three things this changes, and all exist because the deployment target is a
# SHARED, PUBLICLY ADDRESSED host — the aaPanel box already running an IoT
# platform, a WMS, and a dozen client databases.
#
#
# 1. PORTS ARE NOT REACHABLE FROM THE PUBLIC INTERNET
#
# The original design here was loopback-only binding — "127.0.0.1:5433:5432"
# rather than "5433:5432" — reasoning that a port bound to every interface on a
# host with a public IP is a port the internet can reach. That reasoning is
# still correct in general. It had to be abandoned on THIS specific host for a
# narrower reason: Docker could not bind to 127.0.0.1 here at all.
#
# Diagnosed, not guessed: a plain `docker run -p 127.0.0.1:PORT:PORT` failed
# with "address already in use" against a port nothing held (confirmed against
# the kernel's own /proc/net/tcp, not just `ss`/`lsof`/`fuser`, all of which
# also showed nothing). The same container published to 0.0.0.0 worked
# immediately. `net.ipv4.conf.all.route_localnet` was 0 on this host — the
# sysctl that permits DNAT to a loopback destination through a bridge
# interface — and setting it to 1 did not fix the bind either, which means
# something deeper in this host's nftables/UFW stack specifically rejects
# loopback-destined container NAT. Not worth an extended fight on a shared
# host's firewall to get the original design working.
#
# So every port below binds to 0.0.0.0 instead, and the control moved up a
# layer: this host's cloud provider (Huawei Cloud) has a Security Group in
# front of the VM's own network stack entirely, and it does not allow inbound
# traffic on any of these ports by default. PROVEN, not assumed — a throwaway
# container was published on 0.0.0.0 on an arbitrary port and confirmed
# unreachable from a phone on mobile data (a genuinely external network, not
# this host's own LAN) before this change was made.
#
# This is a real, if narrower, guarantee than the loopback bind was: it
# depends on the Security Group's configuration staying as it is today, which
# this repository cannot see or pin. If that Security Group is ever opened
# further (e.g. "allow all" added for an unrelated reason), every port listed
# here becomes internet-reachable with no second layer behind it — unlike the
# loopback design, which needed no external system to stay correct. Whoever
# administers the Huawei Cloud console for this VM should know these ports
# exist and are relying on the Security Group, not on anything in this repo.
#
# To reach the console from a laptop despite this, the same tunnel still
# works — it does not depend on which interface Docker bound to:
#
#   ssh -L 3000:127.0.0.1:3000 -L 8000:127.0.0.1:8000 root@<host>
#
# then open http://127.0.0.1:3000 locally. The traffic rides the SSH session,
# which is already encrypted and already authenticated.
#
#
# 2. MEMORY AND CPU LIMITS
#
# Nothing in the base file limits either. Postgres and MySQL will each grow to
# fill what is available, and the kernel's OOM killer does not ask which
# container matters — it kills whatever scores highest, which on a busy box may
# be somebody's production MariaDB rather than ours.
#
# The user's standing instruction for this deployment is "make sure when we
# deploy didnt broke the others". These limits are that instruction expressed
# in a form the kernel enforces.
#
# Sized for a small VM (4 GB). If the host has more, raise them deliberately
# rather than removing them — an unbounded container on a shared host is the
# thing being prevented, not a small one.
#
#
# 3. KEYCLOAK RUNS IN PRODUCTION MODE, WITH A REAL HOSTNAME
#
# The base file's `start-dev` serves plain HTTP and guesses its own public
# address from request headers — explicitly documented by Keycloak as unfit
# to expose. This overlay switches it to `start` with KC_HOSTNAME set to the
# real domain and KC_HOSTNAME_STRICT on, so it can sit behind aaPanel's Nginx
# (which terminates the actual public TLS connection) without ever guessing
# who is asking or issuing a redirect URL for the wrong origin.
#
# Requires EAIP_DOMAIN in .env — the exact public hostname, no scheme, e.g.
# aiplatform.clbgroups.com — and KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD with
# no default, unlike the base file's admin/admin. A deployment that forgot to
# set a real admin password should fail to start, not start with one anyone
# reading this repository already knows.

services:
  postgres:
    ports:
      # 0.0.0.0, not 127.0.0.1 — see the header comment above for why.
      - "${POSTGRES_PORT:-5433}:5432"
    deploy:
      resources:
        limits:
          # Postgres is the platform's own database: documents, chunks,
          # embeddings, traces, and the agent checkpoints. It gets the largest
          # share because pgvector similarity search is the memory-hungry part.
          memory: 1g
        reservations:
          memory: 256m
    # shm_size matters for Postgres specifically: parallel queries and large
    # sorts use shared memory, and Docker's 64 MB default causes errors that
    # look like corruption but are not.
    shm_size: 256mb
    logging: &logging
      # Without this, container logs grow until the disk fills. On a shared
      # host that takes everything down, not just us.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports:
      # 0.0.0.0, not 127.0.0.1 — see the header comment above for why.
      - "${REDIS_PORT:-6380}:6379"
    # Redis holds rate-limit counters and budget tallies — small, and all of it
    # reconstructible. maxmemory with an eviction policy is better than an OOM
    # kill: losing a counter degrades a limit, losing the process fails every
    # request that needs one.
    command: >-
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save ""
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    logging: *logging

  # The bundled MySQL is a TEST FIXTURE — it exists so the safety suite can run
  # against a real MySQL. It is not part of the running platform and should not
  # be started in production.
  #
  # It cannot simply be omitted: a service absent from the overlay still
  # inherits the base file and starts. `profiles` is what makes it opt-in — it
  # now starts only with `--profile testing`, so a plain `up -d` leaves it out.
  #
  # The IoT data comes from the host's own MariaDB, reached over the loopback
  # interface as a connector row. Not from here.
  mysql:
    profiles: ["testing"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # Identity (ADR 0009). The base file's `start-dev` is a development command:
  # plain HTTP, a bootstrap admin defaulting to admin/admin, and hostname
  # guessed from whatever request arrives — none of that is acceptable once
  # this is reachable from the internet, even behind a reverse proxy.
  #
  # aaPanel's own Nginx terminates the public TLS connection for
  # aiplatform.clbgroups.com and forwards to Keycloak over loopback as plain
  # HTTP — the same shape as EAIP's own backend and frontend. Keycloak does
  # not need its own certificate; it needs to be TOLD the truth about the
  # connection in front of it, which is what KC_HOSTNAME and KC_PROXY_HEADERS
  # do below. Get either wrong and Keycloak issues tokens and redirect URLs for
  # the wrong origin — a login that works from the server itself and breaks
  # for every real visitor, because the browser is being told to go somewhere
  # that is not the actual public address.
  keycloak:
    # start-dev auto-imports the realm on every boot if the volume is fresh,
    # serves plain HTTP with hostname guessing, and is explicitly documented
    # as unfit to expose. `start` requires everything below spelled out
    # instead of guessed, which is the point.
    #
    # Not `start --optimized` — that flag assumes a custom image already
    # built with `kc.sh build` baked in, and fails first boot against the
    # stock image with "The '--optimized' flag was used for first ever server
    # start. Please don't use this flag for the first startup or use 'kc.sh
    # build' to build the server first." Confirmed by actually booting the
    # stock image with each flag before writing this. Optimizing the startup
    # is a real thing to come back to; it is not free with this image alone.
    #
    # --import-realm is not implied by `start` the way it's implied by the
    # base file's `start-dev --import-realm` — dropped here on the first
    # attempt at writing this, and only caught by actually deploying: the
    # container boots cleanly, reports healthy, and `/realms/eaip` returns
    # "Realm does not exist" because nothing ever told it to read
    # realm-eaip.json. Same one-time-only behavior as dev (see
    # infra/keycloak/README.md): it imports only when the realm doesn't
    # already exist, so this flag is safe to leave on permanently rather
    # than removing it after the first successful boot.
    command: ["start", "--import-realm"]
    environment:
      # No default here, unlike the base file's admin/admin. A production
      # deployment with no admin password set should fail to start, not start
      # with a credential anyone can find in this repository.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # `start` (unlike `start-dev`) refuses to boot at all without this,
      # failing with "Key material not provided to setup HTTPS. Please
      # configure your keys/certificates or start the server in development
      # mode." Keycloak has no way to tell "a reverse proxy terminates TLS in
      # front of me" apart from "nobody configured TLS" — this line is that
      # missing distinction, made explicit rather than left to a guess. The
      # container's own port is never published beyond loopback (below), so
      # the plaintext hop is aaPanel's Nginx to this container on the same
      # host, not the public internet.
      KC_HTTP_ENABLED: "true"
      # The public address, exactly as a browser will type it — scheme
      # included, so Keycloak knows the outside world is HTTPS even though
      # the connection reaching this container is plain HTTP from aaPanel's
      # Nginx. Without the scheme, Keycloak has no way to know the difference
      # between "the proxy talks HTTP to me" and "the internet talks HTTP to
      # everyone", and would issue http:// redirect URLs a browser then
      # refuses or a real attacker could intercept.
      KC_HOSTNAME: https://${EAIP_DOMAIN}
      # Never guess the hostname from request headers in production — a
      # request claiming to be any host would otherwise be believed.
      KC_HOSTNAME_STRICT: "true"
      # aaPanel's Nginx sets X-Forwarded-* headers, which is the standard this
      # value names. Without it, Keycloak sees a loopback connection from
      # Nginx and has no idea a TLS-terminated public request produced it —
      # every generated URL comes out http://127.0.0.1, not the real address.
      KC_PROXY_HEADERS: xforwarded
    # 0.0.0.0, not 127.0.0.1 — see the header comment above for why. aaPanel's
    # Nginx could reach this over the docker-compose network by container name
    # instead of a published port at all, but the port stays published so an
    # operator's SSH tunnel (`ssh -L 8081:127.0.0.1:8081 ...`) keeps working
    # the same way as the others.
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging: *logging

  # No published port. The base file already publishes none — this only adds
  # the memory limit and logging every other service in this overlay gets.
  # Keycloak reaches it over the compose network by service name; nothing
  # outside this stack, including an operator's own SSH tunnel, has a reason
  # to connect to it directly.
  keycloak-db:
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging: *logging
